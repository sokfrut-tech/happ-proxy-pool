name: Update Happ Proxy Pool

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: happ-proxy-pool
  cancel-in-progress: false

jobs:
  build-pool:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect encrypted share links and check TCP endpoints
        run: python3 generator.py

      - name: Validate generated JSON
        run: python3 -m json.tool happ_config.json > /dev/null

      - name: Commit updated pool
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add happ_config.json
          if git diff --cached --quiet; then
            echo "No changes in proxy pool."
            exit 0
          fi
          git commit -m "Update Happ proxy pool [skip ci]"
          git push
