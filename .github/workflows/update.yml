name: Update Happ Proxy Pool

on:
  push:
    branches: ["main", "prototype/xray-real-checks"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: happ-proxy-pool
  cancel-in-progress: false

jobs:
  build-pool:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Xray core
        run: |
          curl -fsSL https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o /tmp/xray.zip
          unzip -q /tmp/xray.zip xray -d /tmp/xray
          chmod +x /tmp/xray/xray
          /tmp/xray/xray version

      - name: Collect and verify nodes with real HTTPS requests
        run: python3 generator.py --xray /tmp/xray/xray

      - name: Validate generated config with Xray
        run: |
          python3 -m json.tool happ_config.json > /dev/null
          /tmp/xray/xray run -test -c happ_config.json

      - name: Commit verified pool safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add happ_config.json happ_subscription.txt
          if git diff --cached --quiet; then
            echo "No changes in verified pool."
            exit 0
          fi
          git commit -m "Update Happ pool with Xray-verified nodes [skip ci]"
          # Another scheduled/PR run may have advanced the branch after checkout.
          # Rebase our generated files onto the latest branch and retry safely.
          for attempt in 1 2 3; do
            git pull --rebase origin prototype/xray-real-checks
            if git push origin HEAD:prototype/xray-real-checks; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Could not publish after three rebase/push attempts."
          exit 1
