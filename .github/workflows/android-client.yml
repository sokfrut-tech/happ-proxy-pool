name: Android client prototype
on:
  push:
    branches:
      - feature/happ-compatible-android-client
  pull_request:
    branches:
      - main
      - prototype/xray-real-checks
      - feature/happ-compatible-android-client
  workflow_dispatch:

permissions:
  contents: read

env:
  LIBXRAY_TAG: v26.10.29
  GOMOBILE_PKG: golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
  NDK_VERSION: 27.2.12479018
  # SHA-256 AAR, записанный из логов запуска 41004085041. Только для сведения: сравнение не блокирует сборку.
  LIBXRAY_AAR_SHA256_REFERENCE: 1ab93493fd55ab418666dcadc92ee7e6d79033f327f1dded77cfbecc6fa130ff

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Checkout libXray at pinned tag
        uses: actions/checkout@v4
        with:
          repository: XTLS/libXray
          ref: ${{ env.LIBXRAY_TAG }}
          path: libxray-src
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go from libXray go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: libxray-src/go.mod
          cache: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android platform and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}"

      - name: Build libXray AAR from pinned source
        working-directory: libxray-src
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/android-client/app/libs"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          go install "$GOMOBILE_PKG"
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          gomobile bind -target android -androidapi 21 -trimpath \
            -ldflags="-checklinkname=0 -s -w -buildid= -extldflags=-Wl,-z,max-page-size=16384" \
            -o "$GITHUB_WORKSPACE/android-client/app/libs/libXray.aar" ./
          cd "$GITHUB_WORKSPACE/android-client/app/libs"
          actual=$(sha256sum libXray.aar | cut -d' ' -f1)
          echo "Built AAR SHA-256: $actual" >> "$GITHUB_STEP_SUMMARY"
          if [ "$actual" != "$LIBXRAY_AAR_SHA256_REFERENCE" ]; then
            echo "Built AAR differs from reference hash (informational): reference $LIBXRAY_AAR_SHA256_REFERENCE" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "ABIs in AAR:" >> "$GITHUB_STEP_SUMMARY"
          unzip -l libXray.aar | grep -o 'jni/[^/]*/' | sort -u >> "$GITHUB_STEP_SUMMARY"
          unzip -l libXray.aar | grep -q 'jni/arm64-v8a/' || { echo "::error::AAR без arm64-v8a"; exit 1; }

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/unit.log"
        working-directory: android-client

      - name: Show compile errors as annotations
        if: failure()
        shell: bash
        run: |
          f="$RUNNER_TEMP/unit.log"
          [ -f "$f" ] || exit 0
          grep -E "^e: |What went wrong|Could not|Execution failed|FAILED" "$f" | head -40 | while IFS= read -r line; do
            echo "::error::${line//$'\r'/}"
          done
          # Диагностика AAR: что лежит в app/libs и какие классы внутри (для привязки LibXrayEngine).
          echo "::error::DIAG libs: $(ls -la "$GITHUB_WORKSPACE/android-client/app/libs" 2>&1 | tr '\n' ' ')"
          aar="$GITHUB_WORKSPACE/android-client/app/libs/libXray.aar"
          if [ -f "$aar" ]; then
            unzip -l "$aar" > "$RUNNER_TEMP/aar-list.txt" 2>&1 || true
            echo "::error::DIAG aar entries: $(head -20 "$RUNNER_TEMP/aar-list.txt" | awk '{print $4}' | tr '\n' ' ')"
            unzip -o -q "$aar" classes.jar -d "$RUNNER_TEMP/aarx" || true
            unzip -l "$RUNNER_TEMP/aarx/classes.jar" > "$RUNNER_TEMP/jar-list.txt" 2>&1 || true
            grep -E 'LibXray|DialerController' "$RUNNER_TEMP/jar-list.txt" | awk '{print $4}' | head -20 > "$RUNNER_TEMP/names.txt" || true
            while IFS= read -r n; do echo "::error::DIAG class: $n"; done < "$RUNNER_TEMP/names.txt"
          fi

      - name: Build debug APK
        run: gradle assembleDebug
        working-directory: android-client

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: happ-compatible-debug
          path: android-client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
