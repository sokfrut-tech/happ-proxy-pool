name: Build libXray AAR (pinned)

# Собирает libXray из закреплённого тега прямо в CI. Не использует готовые бинарники из интернета.
# Запускается вручную или при изменении этого файла в рабочей ветке. Основная сборка клиента не затрагивается.

on:
  workflow_dispatch:
  push:
    branches: ["feature/happ-compatible-android-client"]
    paths: [".github/workflows/libxray-aar.yml"]

permissions:
  contents: read

env:
  LIBXRAY_TAG: v26.10.29
  GOMOBILE_PKG: golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
  NDK_VERSION: 27.2.12479018

jobs:
  build-aar:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout libXray at pinned tag
        uses: actions/checkout@v4
        with:
          repository: XTLS/libXray
          ref: ${{ env.LIBXRAY_TAG }}
          path: libxray
          fetch-depth: 1

      - name: Set up Go from libXray go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: libxray/go.mod
          cache: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 ndk;${{ env.NDK_VERSION }}"

      - name: Install gomobile and build AAR
        working-directory: libxray
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          set -euo pipefail
          go install "$GOMOBILE_PKG"
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          gomobile bind -target android -androidapi 21 -trimpath \
            -ldflags="-checklinkname=0 -s -w -buildid= -extldflags=-Wl,-z,max-page-size=16384" \
            -o "$GITHUB_WORKSPACE/out/libXray.aar" ./
          cd "$GITHUB_WORKSPACE/out"
          sha256sum libXray.aar | tee libXray.aar.sha256
          ls -l libXray.aar

      - name: Summary
        run: |
          echo "### libXray ${LIBXRAY_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat out/libXray.aar.sha256 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: libxray-aar-${{ env.LIBXRAY_TAG }}
          path: |
            out/libXray.aar
            out/libXray.aar.sha256
          if-no-files-found: error
